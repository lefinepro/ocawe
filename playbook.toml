[[targets.default.hosts]]
name = "localhost"
host = "127.0.0.1"

[[tasks]]
name = "install-fail2ban"

[[tasks.commands]]
name = "install fail2ban"
script = """
set -eu

if command -v fail2ban-client >/dev/null 2>&1; then
  fail2ban-client -V || true
  exit 0
fi

PM=""
if command -v apt-get >/dev/null 2>&1; then
  PM="apt"
elif command -v dnf5 >/dev/null 2>&1; then
  PM="dnf5"
elif command -v dnf >/dev/null 2>&1; then
  PM="dnf"
elif command -v microdnf >/dev/null 2>&1; then
  PM="microdnf"
elif command -v yum >/dev/null 2>&1; then
  PM="yum"
elif command -v zypper >/dev/null 2>&1; then
  PM="zypper"
elif command -v pacman >/dev/null 2>&1; then
  PM="pacman"
elif command -v apk >/dev/null 2>&1; then
  PM="apk"
elif command -v xbps-install >/dev/null 2>&1; then
  PM="xbps"
elif command -v emerge >/dev/null 2>&1; then
  PM="emerge"
elif command -v nix-env >/dev/null 2>&1; then
  PM="nix"
else
  echo "Unsupported Linux distribution: cannot find a known package manager" >&2
  exit 1
fi

SUDO=""
if [ "$PM" != "nix" ] && [ "$(id -u)" -ne 0 ]; then
  if command -v sudo >/dev/null 2>&1; then
    SUDO="sudo"
  else
    echo "Need root/sudo privileges to install fail2ban with '$PM'" >&2
    exit 1
  fi
fi

case "$PM" in
  apt)
    $SUDO apt-get update
    DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y fail2ban
    ;;
  dnf5)
    $SUDO dnf5 install -y fail2ban
    ;;
  dnf)
    $SUDO dnf install -y fail2ban
    ;;
  microdnf)
    $SUDO microdnf install -y fail2ban
    ;;
  yum)
    $SUDO yum install -y fail2ban
    ;;
  zypper)
    $SUDO zypper --non-interactive install --auto-agree-with-licenses fail2ban
    ;;
  pacman)
    $SUDO pacman -Sy --noconfirm --needed fail2ban
    ;;
  apk)
    $SUDO apk add --no-cache fail2ban
    ;;
  xbps)
    $SUDO xbps-install -Sy fail2ban
    ;;
  emerge)
    $SUDO emerge --ask=n net-analyzer/fail2ban
    ;;
  nix)
    nix-env -iA nixpkgs.fail2ban
    ;;
esac

fail2ban-client -V || true
"""
