name: docker-publish

on:
  push:
    branches: ["release"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ocawe
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Build OCI image with Nix
        run: |
          nix build .#oci-image --print-build-logs
          docker load < result

      - name: Tag and push image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag ocawe:latest "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
