name: docker-publish

on:
  push:
    branches: ["release"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cogni
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Ensure GHCR package is public
        if: ${{ github.ref == 'refs/heads/release' }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GHCR_ADMIN_TOKEN secret is required to set package visibility to public." >&2
            exit 1
          fi
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            URL="https://api.github.com/orgs/${OWNER}/packages/container/cogni/visibility"
          else
            URL="https://api.github.com/user/packages/container/cogni/visibility"
          fi
          curl -fsSL -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${URL}" \
            -d '{"visibility":"public"}'
