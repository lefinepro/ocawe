name: mastra-client-tests

on:
  pull_request:
    paths:
      - "packages/mastra-client-tests/**"
      - ".github/workflows/mastra-client-tests.yml"
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
    paths:
      - "packages/mastra-client-tests/**"
      - ".github/workflows/mastra-client-tests.yml"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        working-directory: packages/mastra-client-tests
        run: bun install

      - name: Run integration tests
        working-directory: packages/mastra-client-tests
        run: bun test

      - name: Run coverage
        working-directory: packages/mastra-client-tests
        run: bun test --coverage
