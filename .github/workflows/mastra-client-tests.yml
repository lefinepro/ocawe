name: mastra-client-tests

on:
  pull_request:
    paths:
      - "packages/mastra-client-tests/**"
      - ".github/workflows/mastra-client-tests.yml"
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
    paths:
      - "packages/mastra-client-tests/**"
      - ".github/workflows/mastra-client-tests.yml"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        working-directory: packages/mastra-client-tests
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        working-directory: packages/mastra-client-tests
        run: pnpm run test

      - name: Run coverage
        working-directory: packages/mastra-client-tests
        run: pnpm run test:integration:coverage
