name: release-tag-assets

on:
  push:
    tags:
      - '20*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (example: 2026.07.00)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}

    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag_name }}

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.9.0 --activate

      - name: Install shards
        run: shards update --production --skip-postinstall

      - name: Patch dependency Crystal compatibility
        run: |
          if [ -f lib/nbchannel/src/nbchannel.cr ]; then
            perl -pi -e 's/Crystal::Scheduler\.reschedule/Fiber.yield/' lib/nbchannel/src/nbchannel.cr
          fi

      - name: Build runtime binary
        run: |
          mkdir -p build release
          crystal build src/cli/main.cr --release --no-debug -o build/ocawe
          crystal build src/ocawe.cr --release --no-debug -Docawe_runtime_main -o build/ocawecore

      - name: Build playground prebuild
        run: |
          pnpm --dir packages/playground install --frozen-lockfile
          pnpm --dir packages/playground run build
          test -d packages/playground/dist

      - name: Build docs static
        run: |
          pnpm --dir packages/docs install --frozen-lockfile
          pnpm --dir packages/docs run build
          test -d packages/docs/.vitepress/dist

      - name: Package assets
        run: |
          mkdir -p dist/ocawe/bin dist/ocawe/libexec dist/ocawe/share/ocawe/source dist/ocawe/share/doc/ocawe
          install -m 0755 build/ocawe dist/ocawe/libexec/ocawe
          install -m 0755 build/ocawecore dist/ocawe/libexec/ocawecore
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"' 'exec "${root}/libexec/ocawe" "$@"' > dist/ocawe/bin/ocawe
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"' 'exec "${root}/libexec/ocawecore" "$@"' > dist/ocawe/bin/ocawecore
          chmod 0755 dist/ocawe/bin/ocawe dist/ocawe/bin/ocawecore
          cp -R caws scripts dist/ocawe/share/ocawe/
          cp -R src lib shard.yml shard.lock shards.nix dist/ocawe/share/ocawe/source/
          install -m 0644 README.org dist/ocawe/share/doc/ocawe/README.org
          install -m 0755 install.sh release/install.sh
          tar -czf release/ocawe-linux-x86_64.tar.gz -C dist/ocawe .
          tar -czf release/ocawecore-linux.tar.gz -C build ocawecore
          tar -czf release/ocawe-playground-dist.tar.gz -C packages/playground dist
          tar -czf release/ocawe-docs-dist.tar.gz -C packages/docs/.vitepress dist
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/install.sh

  publish-release:
    needs: build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release-assets.outputs.tag_name }}
          files: |
            release/ocawe-linux-x86_64.tar.gz
            release/ocawecore-linux.tar.gz
            release/ocawe-playground-dist.tar.gz
            release/ocawe-docs-dist.tar.gz
            release/SHA256SUMS
            release/install.sh
          generate_release_notes: true
