name: release-tag-assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (example: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}

    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag_name }}

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install shards
        run: shards install

      - name: Build runtime binary
        run: |
          mkdir -p build release
          crystal build src/cogni.cr --release -o build/cognicore

      - name: Build playground prebuild
        run: |
          bun --cwd packages/playground install
          bun --cwd packages/playground run build
          test -d packages/playground/dist

      - name: Build docs static
        run: |
          bun --cwd packages/docs install
          bun --cwd packages/docs run build
          test -d packages/docs/.vitepress/dist

      - name: Package assets
        run: |
          tar -czf release/cognicore-linux.tar.gz -C build cognicore
          tar -czf release/cogni-playground-dist.tar.gz -C packages/playground dist
          tar -czf release/cogni-docs-dist.tar.gz -C packages/docs/.vitepress dist

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: release/*.tar.gz

  publish-release:
    needs: build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release-assets.outputs.tag_name }}
          files: |
            release/cognicore-linux.tar.gz
            release/cogni-playground-dist.tar.gz
            release/cogni-docs-dist.tar.gz
          generate_release_notes: true
