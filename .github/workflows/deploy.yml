name: Deploy

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ] || { echo "Missing secret: SSH_HOST"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "Missing secret: SSH_USER"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "Missing secret: SSH_KEY"; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { echo "Missing secret: DEPLOY_PATH"; exit 1; }

      - name: Prepare SSH private key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_FILE="$GITHUB_WORKSPACE/.deploy_key"
          TMP_FILE="$GITHUB_WORKSPACE/.deploy_key.tmp"
          # Accept private keys in these secret formats:
          # 1) raw multi-line PEM/OpenSSH key
          # 2) single-line string with escaped \n
          # 3) base64-encoded private key blob
          CLEANED="$(printf '%s' "$SSH_KEY" | tr -d '\r')"
          CLEANED="${CLEANED#\"}"
          CLEANED="${CLEANED%\"}"

          if printf '%s' "$CLEANED" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%b' "$CLEANED" > "$TMP_FILE"
          else
            if printf '%s' "$CLEANED" | base64 -d > "$TMP_FILE" 2>/dev/null; then
              :
            else
              printf '%b' "$CLEANED" > "$TMP_FILE"
            fi
          fi

          mv "$TMP_FILE" "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # rsync/ssh can't prompt in CI; convert encrypted key to temp unencrypted key when passphrase is provided.
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f "$KEY_FILE" >/dev/null
          fi

          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "SSH_KEY is not a valid private key (or passphrase is required and SSH_PASSPHRASE is missing/wrong)."
            exit 1
          fi

      - name: Add host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync full repository with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".astro" \
            -e "ssh -i $GITHUB_WORKSPACE/.deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build on server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ github.workspace }}/.deploy_key
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose up -d --build
