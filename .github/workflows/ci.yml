name: ci

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  workflow_dispatch:

jobs:
  ameba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Install shards
        run: shards install --skip-postinstall --skip-executables

      - name: Patch Ameba dependency compatibility
        run: |
          if [ -f lib/ameba/src/ameba/tokenizer.cr ]; then
            sed -i 's/next_string_array_token/next_token/g' lib/ameba/src/ameba/tokenizer.cr
            if rg -n "next_string_array_token" lib/ameba/src/ameba/tokenizer.cr; then
              echo "Ameba tokenizer still has Crystal-incompatible next_string_array_token call"
              exit 1
            fi
          fi

      - name: Build Ameba
        run: |
          mkdir -p bin
          crystal build -o bin/ameba lib/ameba/src/cli.cr
      - name: Run Ameba
        run: bin/ameba

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Install shards
        run: shards install --production --skip-postinstall --skip-executables
      - name: Patch dependency Crystal compatibility
        run: crystal run scripts/patch_nbchannel.cr

      # `--error-on-warnings` gates deprecated stdlib APIs (e.g. `Time.monotonic`,
      # deprecated in favour of `Time.instant`). Both entrypoints are checked:
      # `-Docawe_runtime_main` pulls in the HTTP app and scheduler, which the
      # plain `src/ocawe.cr` build never reaches.
      - name: Run Crystal syntax smoke-check
        run: |
          crystal build src/ocawe.cr --no-codegen --error-on-warnings
          crystal build src/cli/main.cr --no-codegen --error-on-warnings
          crystal build src/ocawe.cr -Docawe_runtime_main --no-codegen --error-on-warnings

      - name: Build CLI binary for specs
        run: |
          mkdir -p bin
          crystal build src/cli/main.cr -o bin/ocawe

      # `crystal spec` also picks up spec/e2e/, and the cross-process
      # ActivityPub spec spawns this executable as two independent peers.
      # `-Docawe_runtime_main` is what makes the binary actually serve HTTP.
      - name: Build runtime binary for cross-process E2E specs
        run: |
          mkdir -p bin
          crystal build src/ocawe.cr -Docawe_runtime_main -o bin/ocawecore

      - name: Run unit specs (mock mode)
        run: |
          env -u OPENAI_API_KEY -u CLIPROXY_API_KEY COGNICORE_MOCK_LLM=1 \
            crystal spec --error-trace
        env:
          COGNICORE_MOCK_LLM: "1"
          OCAWECORE_BINARY: ${{ github.workspace }}/bin/ocawecore

  e2e-integration:
    runs-on: ubuntu-latest
    # Only run E2E integration tests on push/workflow_dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Install shards
        run: shards install --production --skip-postinstall --skip-executables
      - name: Patch dependency Crystal compatibility
        run: crystal run scripts/patch_nbchannel.cr

      - name: Build CLI binary for specs
        run: |
          mkdir -p bin
          crystal build src/cli/main.cr -o bin/ocawe

      # The cross-process ActivityPub spec spawns this executable twice, so it
      # has to exist before the specs run. `-Docawe_runtime_main` is what makes
      # the binary actually serve HTTP instead of exiting immediately.
      - name: Build runtime binary for cross-process E2E specs
        run: |
          mkdir -p bin
          crystal build src/ocawe.cr -Docawe_runtime_main -o bin/ocawecore

      # Deterministic and offline: the harness always forces mock mode in both
      # children and strips provider keys, so this runs identically with or
      # without repository secrets.
      - name: Run cross-process ActivityPub E2E spec (mock mode)
        run: |
          env -u OPENAI_API_KEY -u CLIPROXY_API_KEY COGNICORE_MOCK_LLM=1 \
            crystal spec spec/e2e/activitypub_agent_communication_spec.cr --error-trace

      # Same harness, but the two peers are the committed `caws/13-activitypub`
      # example bundles, so this step fails if the example drifts out of a
      # working state.
      - name: Run Cawfile ActivityPub send E2E spec (mock mode)
        run: |
          env -u OPENAI_API_KEY -u CLIPROXY_API_KEY COGNICORE_MOCK_LLM=1 \
            crystal spec spec/e2e/activitypub_cawfile_send_spec.cr --error-trace

      - name: Run E2E integration specs
        run: |
          if [ -n "$CLIPROXY_API_KEY" ]; then
            echo "Running E2E integration tests with real API..."
            crystal spec spec/e2e/ --error-trace
          else
            echo "CLIPROXY_API_KEY not configured - running E2E tests in mock mode"
            COGNICORE_MOCK_LLM=1 crystal spec spec/e2e/ --error-trace
          fi
        env:
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          COGNI_E2E_MODEL: "clipproxyapi/qwen3-coder-model"

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.9.0 --activate

      - name: Install shards
        run: shards install --production --skip-postinstall --skip-executables
      - name: Patch dependency Crystal compatibility
        run: crystal run scripts/patch_nbchannel.cr

      - name: Build playground
        working-directory: packages/playground
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          else
            echo "No package.json found in playground, skipping..."
          fi

      - name: Build docs
        working-directory: packages/docs
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          else
            echo "No package.json found in docs, skipping..."
          fi

      # Without `-Docawe_runtime_main` the entrypoint in src/ocawe.cr is compiled
      # out and the published artifact exits immediately instead of serving.
      - name: Build runtime binary
        run: mkdir -p build && crystal build src/ocawe.cr -Docawe_runtime_main --release -o build/ocawecore

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocawecore-linux
          path: build/ocawecore
