name: ci

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  workflow_dispatch:

jobs:
  ameba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install shards
        run: shards update

      - name: Build Ameba
        run: |
          mkdir -p bin
          crystal build -Dpreview_mt -o bin/ameba lib/ameba/src/cli.cr
      - name: Run Ameba
        run: bin/ameba

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Crystal version
        run: crystal --version

      - name: Install shards
        run: shards update --production

      - name: Run Crystal syntax smoke-check
        run: crystal build src/ocawe.cr --no-codegen

      - name: Build CLI binary for specs
        run: |
          mkdir -p bin
          crystal build src/cli/main.cr -o bin/ocawe

      - name: Run unit specs (mock mode)
        run: crystal spec --error-trace
        env:
          OCAWECORE_MOCK_LLM: "1"

  e2e-integration:
    runs-on: ubuntu-latest
    # Only run E2E integration tests on push/workflow_dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install shards
        run: shards update --production

      - name: Run E2E integration specs
        run: |
          if [ -n "$CLIPROXY_API_KEY" ]; then
            echo "Running E2E integration tests with real API..."
            crystal spec spec/e2e/ --error-trace
          else
            echo "CLIPROXY_API_KEY not configured - running E2E tests in mock mode"
            OCAWECORE_MOCK_LLM=1 crystal spec spec/e2e/ --error-trace
          fi
        env:
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OCAWE_E2E_MODEL: "clipproxyapi/qwen3-coder-model"

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.9.0 --activate

      - name: Crystal version
        run: crystal --version

      - name: Install shards
        run: shards update --production

      - name: Build playground
        working-directory: packages/playground
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          else
            echo "No package.json found in playground, skipping..."
          fi

      - name: Build docs
        working-directory: packages/docs
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          else
            echo "No package.json found in docs, skipping..."
          fi

      - name: Build runtime binary
        run: mkdir -p build && crystal build src/ocawe.cr --release -o build/ocawecore

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocawecore-linux
          path: build/ocawecore
