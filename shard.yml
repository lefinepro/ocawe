name: ocawe
version: 26.06.0

authors:
  - OcaweCore Team

targets:
  ocawe:
    main: src/cli/main.cr
  ocawecore:
    main: src/ocawe.cr

crystal: ">= 1.12.0"

dependencies:
  kemal:
    github: kemalcr/kemal
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.13.0
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.21.0
  rcl:
    github: cogniframework/rcl.cr
  pg:
    github: will/crystal-pg
    version: ~> 0.29.0
  aptok:
    github: lion-lef/aptok
    branch: release
  opentelemetry-sdk:
    github: wyhaines/opentelemetry-sdk.cr
    version: ~> 0.6.2
  nbchannel:
    path: lib/nbchannel
  to_html:
    github: sbsoftware/to_html.cr

development_dependencies:
  ameba:
    path: lib/ameba

