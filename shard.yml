name: cogni
version: 0.0.1

authors:
  - CogniCore Team

targets:
  cogni:
    main: src/cli/main.cr
  cognicore:
    main: src/cogni.cr

crystal: ">= 1.12.0"

dependencies:
  kemal:
    github: kemalcr/kemal
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.13.0
  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.21.0
  rcl:
    github: cogniframework/rcl.cr
  pg:
    github: will/crystal-pg
    version: ~> 0.29.0
  aptok:
    github: lion-lef/aptok
    branch: release

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    branch: master

license: MIT
